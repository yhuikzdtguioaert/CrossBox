name: Publish CrossBox firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version, for example 0.1.0 (publishing makes it available to automatic updates)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: crossbox-release
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate and stamp version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Use a stable major.minor.patch version without a v prefix')
          p = Path('configs/archer-ax55-v1.seed')
          p.write_text(re.sub(r'CONFIG_VERSION_NUMBER="[^"]+"', f'CONFIG_VERSION_NUMBER="{version}"', p.read_text()))
          p = Path('firmware/files/etc/crossbox-release')
          p.write_text(re.sub(r"CROSSBOX_VERSION='[^']+'", f"CROSSBOX_VERSION='{version}'", p.read_text()))
          PY
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'This release already exists; use a new version.' >&2
            exit 1
          fi
      - name: Prepare build runner
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev libelf-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl time
      - name: Install pinned feeds
        run: make feeds
      - name: Build AX55 v1 firmware
        run: make firmware JOBS=2
      - name: Verify images and create update manifest
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          root = Path('third_party/openwrt')
          source = root / 'bin/targets/qualcommax/ipq50xx'
          profiles = json.loads((source / 'profiles.json').read_text())
          profile = profiles['profiles']['tplink_archer-ax55-v1']
          version = os.environ['RELEASE_VERSION']
          out = Path('release')
          out.mkdir()
          images = profile['images']
          for image in images:
              p = source / image['name']
              if hashlib.sha256(p.read_bytes()).hexdigest() != image['sha256']:
                  raise SystemExit('Image checksum verification failed')
              shutil.copy2(p, out / p.name)
          name = f'crossbox-{version}-qualcommax-ipq50xx-tplink_archer-ax55-v1-squashfs-sysupgrade.bin'
          image = out / name
          subprocess.run([str(root/'staging_dir/host/bin/fwtool'), '-q', '-i', str(out/'image-metadata.json'), str(image)], check=True)
          metadata = json.loads((out/'image-metadata.json').read_text())
          if metadata['version']['dist'] != 'CrossBox' or metadata['version']['version'] != version or metadata['version']['target'] != 'qualcommax/ipq50xx' or 'tplink,archer-ax55-v1' not in metadata['supported_devices']:
              raise SystemExit('Firmware identity or board compatibility verification failed')
          manifest = {'schema':1, 'repository':'yhuikzdtguioaert/CrossBox', 'version':version, 'device':'tplink_archer-ax55-v1', 'board_name':'tplink,archer-ax55-v1', 'target':'qualcommax/ipq50xx', 'filename':name, 'size':image.stat().st_size, 'sha256':hashlib.sha256(image.read_bytes()).hexdigest()}
          (out/'crossbox-update.json').write_text(json.dumps(manifest, indent=2)+'\n')
          shutil.copy2(source/'profiles.json', out/'profiles.json')
          (out/'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(out.iterdir())))
          PY
      - name: Publish complete stable release
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "v$RELEASE_VERSION" release/* --target "$SOURCE_COMMIT" --title "CrossBox $RELEASE_VERSION" --generate-notes --draft
          gh release edit "v$RELEASE_VERSION" --draft=false --latest
